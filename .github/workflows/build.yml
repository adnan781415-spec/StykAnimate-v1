name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q StykAnimate-App-0.5.5-android.zip
      - run: sed -i 's/"arm64-v8a", "armeabi-v7a", "x86_64"/"arm64-v8a", "x86_64"/' StykAnimate-App-0.5.5/android/app/build.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'
      - run: gradle -p StykAnimate-App-0.5.5/android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StykAnimate-apk
          path: StykAnimate-App-0.5.5/android/app/build/outputs/apk/debug/*.apk
